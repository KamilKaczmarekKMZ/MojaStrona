<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KMZ MUSIC</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
        }

        /* === PRELOADER === */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            height: 2px;
            width: 300px;
            background: rgb(44, 44, 44);
            position: relative;
            overflow: hidden;
        }

        .loader .black_overlay {
            background: linear-gradient(
                87deg,
                rgb(0, 0, 0) 0%,
                rgba(0, 0, 0, 0.14) 30%,
                rgba(0, 0, 0, 0.14) 70%,
                rgb(0, 0, 0) 100%
            );
            position: absolute;
            inset: 0px;
        }

        .loader .light {
            width: 70px;
            height: 100%;
            position: absolute;
            left: -20%;
            top: 0px;
            background: linear-gradient(
                87deg,
                rgba(0, 0, 0, 0) 0%,
                rgb(0, 204, 255) 40%,
                rgb(0, 204, 255) 60%,
                rgba(0, 0, 0, 0) 100%
            );
            animation: light 2s infinite ease-in-out;
        }

        @keyframes light {
            from { left: -30%; }
            to { left: 100%; }
        }

        .loading-text {
            font-family: 'Inter', monospace;
            font-size: 12px;
            letter-spacing: 4px;
            color: rgba(0, 204, 255, 0.8);
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; text-shadow: 0 0 5px rgba(0, 204, 255, 0.5); }
        }

        /* === LOGO 3D NA GÓRZE === */
        .logo-3d-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .logo-3d-container.loaded {
            opacity: 1;
        }

        .logo-3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .model-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            color: white;
            font-size: 10px;
        }

        /* === WIZUALIZATOR AUDIO W TLE === */
        #visualizer-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #visualizer-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* === KARUZELA 3D === */
        #wrap {
            background-color: rgba(0,0,0,0.4);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #wrap.visible {
            opacity: 1;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            perspective: 1200px;
        }

        .inner {
            --w: 220px;
            --h: 220px;
            --translateZ: 200px;
            --rotateX: 0deg;
            --perspective: 1000px;
            position: relative;
            width: var(--w);
            height: var(--h);
            top: 0;
            left: 0;
            z-index: 2;
            transform-style: preserve-3d;
            transform: perspective(var(--perspective));
            transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            margin: 0 auto;
        }

        .card {
            position: absolute;
            border-radius: 8px;
            overflow: visible;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotateY(calc((360deg / var(--quantity)) * var(--index))) translateZ(var(--translateZ));
            backface-visibility: visible;
        }

        .album-card {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .neon-glow {
            position: absolute;
            top: -8%;
            left: -8%;
            width: 116%;
            height: 116%;
            border-radius: 8px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card.active .neon-glow {
            opacity: 1 !important;
        }

        .cover {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 5px 0 20px 0 rgba(0,0,0,0.6),
                        inset 0 0 10px 5px rgba(255,255,255,0.2),
                        inset 0 0 4px 2px rgba(0,0,0,0.2);
            border-radius: 8px;
            pointer-events: auto;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

        .cover.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .cover::before {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            width: 100%;
            height: 100%;
            background-image: url('http://i.imgur.com/i0fMWpe.jpg');
            background-size: 100% 100%;
            border-radius: 8px;
            mix-blend-mode: screen;
            opacity: 0.5;
            content: '';
            pointer-events: none;
        }

        .cover::after {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            width: 100%;
            height: 100%;
            background-image: url('https://orig06.deviantart.net/0124/f/2013/136/6/7/texture_326_by_sirius_sdz-d65gs3s.jpg');
            background-size: 100% 100%;
            border-radius: 8px;
            mix-blend-mode: screen;
            opacity: 0.2;
            content: '';
            pointer-events: none;
        }

        .vinyl {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 90%;
            height: 90%;
            display: block;
            background-image: url('https://gallery.yopriceville.com/var/resizes/Free-Clipart-Pictures/Music-PNG/Gramophone_Vinyl_LP_Record_PNG_Transparent_Clip_Art_Image.png?m=1462983196');
            background-size: 106% 106%;
            background-position: center;
            box-shadow: 0 0 20px 4px rgba(0,0,0,0.6);
            border-radius: 50%;
            transform-origin: center center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .vinyl.visible {
            opacity: 1;
        }

        .vinyl::before {
            position: absolute;
            top: 2.5%;
            left: 2.5%;
            z-index: 10;
            width: 95%;
            height: 95%;
            background-image: url('http://www.designresourcebox.com/ths/diverse/blacktextures/82267467.jpg');
            background-size: 100% 100%;
            border-radius: 50%;
            mix-blend-mode: screen;
            opacity: 0.3;
            content: '';
            pointer-events: none;
        }

        .vinyl .print {
            position: absolute;
            top: 33%;
            left: 33%;
            height: 34%;
            width: 34%;
            box-shadow: inset 0 0 0 5px rgba(150,150,150,0.5);
            background-size: cover;
            border-radius: 50%;
            pointer-events: none;
        }

        /* === PRZYCISK PLAY/STOP - ZAWSZE WIDOCZNY DLA AKTYWNEJ PŁYTY === */
        .playBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            border: 2px solid white;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
            opacity: 1 !important;
            visibility: visible !important;
        }

        .playBtn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(166, 122, 91, 0.9);
            border-color: #A67A5B;
        }

        /* Przycisk zawsze widoczny dla aktywnej płyty */
        .card.active .playBtn {
            opacity: 1 !important;
            visibility: visible !important;
        }

        /* Gdy płyta gra - zmiana koloru przycisku */
        .playBtn.playing {
            background: rgba(166, 122, 91, 0.9);
            border-color: #A67A5B;
        }

        .vinyl-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28%;
            height: 28%;
            background: radial-gradient(circle, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.7) 100%);
            border-radius: 50%;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.7);
            font-size: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
            pointer-events: none;
            backdrop-filter: blur(2px);
            font-weight: bold;
        }

        .vinyl-label span {
            transform: rotate(-15deg);
        }

        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            font-size: 24px;
            color: white;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .nav-arrow:hover {
            background: rgba(166, 122, 91, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-left {
            left: 20px;
        }

        .nav-right {
            right: 20px;
        }

        /* === ODTWARZACZ NA DOLE === */
        .player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 12px 20px;
            z-index: 100;
            display: none;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            font-family: 'Inter', sans-serif;
        }

        .player.visible {
            display: flex;
        }

        .player-play-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #A67A5B, #c9956b);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .player-play-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #c9956b, #A67A5B);
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-title {
            color: white;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-progress-container {
            flex: 2;
            min-width: 100px;
        }

        .progress-wrapper {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #A67A5B, #e0a87c);
            border-radius: 2px;
            position: relative;
        }

        .progress-handle {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translate(50%, -50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 8px rgba(166, 122, 91, 0.8);
            transition: transform 0.1s;
        }

        .progress-handle:active {
            cursor: grabbing;
            transform: translate(50%, -50%) scale(1.3);
        }

        .player-times {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-family: monospace;
            color: rgba(255,255,255,0.7);
            flex-shrink: 0;
        }

        @media (max-width: 550px) {
            .player {
                padding: 10px 15px;
                gap: 10px;
            }
            .player-play-btn {
                width: 38px;
                height: 38px;
                font-size: 14px;
            }
            .player-title {
                font-size: 12px;
            }
            .player-artist {
                font-size: 10px;
            }
            .player-times {
                font-size: 9px;
            }
            .loader {
                width: 250px;
            }
            .loading-text {
                font-size: 10px;
            }
            .playBtn {
                width: 38px;
                height: 38px;
                font-size: 12px;
            }
        }

        @media (max-width: 768px) {
            .inner {
                --w: 160px;
                --h: 160px;
                --translateZ: 150px;
            }
            .nav-arrow {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
            .vinyl-label {
                font-size: 7px;
            }
            .logo-3d-container {
                width: 60px;
                height: 60px;
                top: 15px;
            }
            .playBtn {
                width: 38px;
                height: 38px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .logo-3d-container {
                width: 50px;
                height: 50px;
                top: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- PRELOADER -->
    <div id="preloader" class="preloader">
        <div class="loader">
            <div class="black_overlay"></div>
            <div class="light"></div>
        </div>
        <div class="loading-text">LOADING</div>
    </div>

    <!-- LOGO 3D NA GÓRZE -->
    <div id="logoContainer" class="logo-3d-container">
        <model-viewer
            id="logo3d"
            class="logo-3d"
            src="assets/twoje-logo.glb"
            alt="3D Logo"
            interaction-prompt="none"
            camera-orbit="0deg 90deg 0deg"
            exposure="1.2"
            environment-image="https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr"
            shadow-intensity="0"
            auto-rotate
            rotation-per-second="15deg"
            style="background-color: transparent; width: 100%; height: 100%;"
        >
            <div class="model-placeholder" slot="poster">
                <p>Ładowanie...</p>
            </div>
        </model-viewer>
    </div>

    <div id="visualizer-container">
        <canvas id="visualizer-canvas"></canvas>
    </div>

    <div id="wrap">
        <div class="nav-arrow nav-left" id="prevBtn">◀</div>
        <div class="nav-arrow nav-right" id="nextBtn">▶</div>

        <div class="wrapper">
            <div class="inner" id="carousel3d" style="--quantity: 3;"></div>
        </div>
    </div>

    <!-- ODTWARZACZ NA DOLE -->
    <div id="player" class="player">
        <button id="playerPlayBtn" class="player-play-btn">▶</button>
        <div class="player-info">
            <div id="playerTitle" class="player-title">Brak utworu</div>
            <div id="playerArtist" class="player-artist">-</div>
        </div>
        <div class="player-progress-container">
            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-fill" id="progressFill">
                    <div class="progress-handle" id="progressHandle"></div>
                </div>
            </div>
        </div>
        <div class="player-times">
            <span id="currentTime">0:00</span>
            <span>/</span>
            <span id="durationTime">0:00</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.175.0"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";

        // === PRELOADER ===
        const preloader = document.getElementById('preloader');
        const wrap = document.getElementById('wrap');
        const logoContainer = document.getElementById('logoContainer');
        
        function hidePreloader() {
            preloader.classList.add('hidden');
            wrap.classList.add('visible');
            logoContainer.classList.add('loaded');
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        }
        
        const logoModel = document.getElementById('logo3d');
        let logoLoaded = false;
        let threeReady = false;
        
        if (logoModel) {
            logoModel.addEventListener('load', () => {
                logoLoaded = true;
                if (threeReady) hidePreloader();
            });
            setTimeout(() => {
                if (!logoLoaded) {
                    logoLoaded = true;
                    if (threeReady) hidePreloader();
                }
            }, 3000);
        } else {
            logoLoaded = true;
        }
        
        // === TWOJE UTWORY MP3 ===
        const twojUtwor = "https://raw.githubusercontent.com/KamilKaczmarekKMZ/MojaStrona/main/American%20Boy%20In%20Paris.mp3";
        
        // === DANE PŁYT ===
        const albumsData = [
            {
                cover: 'https://raw.githubusercontent.com/KamilKaczmarekKMZ/MojaStrona/main/American%20Boy%20In%20Paris.png',
                print: 'http://assets.teamrock.com/image/14d29742-c6f7-43f6-bbe1-6bf7b3b34c6f?w=800',
                neonColor: { r: 0, g: 150, b: 255 },
                vizColor: { r: 0.2, g: 0.5, b: 0.9 },
                audioUrl: twojUtwor,
                title: "American Boy In Paris",
                artist: "DJ KMZ"
            },
            {
                cover: 'https://raw.githubusercontent.com/KamilKaczmarekKMZ/MojaStrona/main/Hip%20Hop%20Cover.png',
                print: 'http://assets.teamrock.com/image/14d29742-c6f7-43f6-bbe1-6bf7b3b34c6f?w=800',
                neonColor: { r: 156, g: 0, b: 255 },
                vizColor: { r: 0.6, g: 0.2, b: 0.9 },
                audioUrl: twojUtwor,
                title: "Hip Hop",
                artist: "DJ KMZ"
            },
            {
                cover: 'https://raw.githubusercontent.com/KamilKaczmarekKMZ/MojaStrona/main/Pop%20cover.png',
                print: 'http://assets.teamrock.com/image/14d29742-c6f7-43f6-bbe1-6bf7b3b34c6f?w=800',
                neonColor: { r: 0, g: 200, b: 100 },
                vizColor: { r: 0.2, g: 0.8, b: 0.4 },
                audioUrl: twojUtwor,
                title: "Pop",
                artist: "DJ KMZ"
            }
        ];
        
        // === KARUZELA 3D ===
        const carousel = document.getElementById('carousel3d');
        const quantity = albumsData.length;
        carousel.style.setProperty('--quantity', quantity);
        
        let currentRotation = 0;
        let currentCardIndex = 1;
        let cards = [];
        let isTransitioning = false;
        
        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let currentAudio = null;
        let currentAlbumCard = null;
        let isSeeking = false;
        
        let isVinylSpinning = false;
        let rotationAnimation = null;
        let currentRotationDeg = 0;
        let lastTimestamp = 0;
        
        const player = document.getElementById('player');
        const playerPlayBtn = document.getElementById('playerPlayBtn');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const progressFill = document.getElementById('progressFill');
        const progressWrapper = document.getElementById('progressWrapper');
        const currentTimeSpan = document.getElementById('currentTime');
        const durationTimeSpan = document.getElementById('durationTime');
        
        let updateInterval = null;
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateProgressBar() {
            if (!currentAudio || !currentAlbumCard) return;
            if (currentAudio.duration && !isNaN(currentAudio.duration)) {
                const percent = (currentAudio.currentTime / currentAudio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeSpan.textContent = formatTime(currentAudio.currentTime);
                durationTimeSpan.textContent = formatTime(currentAudio.duration);
            }
        }
        
        function startProgressUpdates() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                if (currentAudio && currentAlbumCard) {
                    updateProgressBar();
                }
            }, 100);
        }
        
        function stopProgressUpdates() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }
        
        function showPlayer(title, artist) {
            playerTitle.textContent = title;
            playerArtist.textContent = artist;
            progressFill.style.width = '0%';
            currentTimeSpan.textContent = '0:00';
            durationTimeSpan.textContent = '0:00';
            player.classList.add('visible');
            startProgressUpdates();
        }
        
        function hidePlayer() {
            player.classList.remove('visible');
            stopProgressUpdates();
        }
        
        function startVinylSpinning(vinylElement) {
            if (rotationAnimation) cancelAnimationFrame(rotationAnimation);
            lastTimestamp = 0;
            
            function animateSpin(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const delta = Math.min(0.033, (timestamp - lastTimestamp) / 1000);
                lastTimestamp = timestamp;
                
                if (isVinylSpinning && vinylElement) {
                    currentRotationDeg += 72 * delta;
                    currentRotationDeg = currentRotationDeg % 360;
                    vinylElement.style.transform = `translate(-50%, -50%) rotate(${currentRotationDeg}deg)`;
                }
                rotationAnimation = requestAnimationFrame(animateSpin);
            }
            rotationAnimation = requestAnimationFrame(animateSpin);
        }
        
        function stopVinylSpinning() {
            if (rotationAnimation) {
                cancelAnimationFrame(rotationAnimation);
                rotationAnimation = null;
            }
        }
        
        function resetVinylRotation(vinylElement) {
            currentRotationDeg = 0;
            if (vinylElement) {
                vinylElement.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            }
        }
        
        function stopAllAudioAndReset() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (currentAlbumCard) {
                currentAlbumCard.isPlaying = false;
                currentAlbumCard.updateVisualState();
                currentAlbumCard = null;
            }
            isVinylSpinning = false;
            stopVinylSpinning();
            hidePlayer();
            playerPlayBtn.textContent = '▶';
        }
        
        function togglePlayPause() {
            if (!currentAudio || !currentAlbumCard) return;
            
            if (currentAudio.paused) {
                currentAudio.play();
                playerPlayBtn.textContent = '⏸';
                isVinylSpinning = true;
            } else {
                currentAudio.pause();
                playerPlayBtn.textContent = '▶';
                isVinylSpinning = false;
            }
        }
        
        playerPlayBtn.addEventListener('click', togglePlayPause);
        
        function generateCarousel() {
            carousel.innerHTML = '';
            cards = [];
            
            albumsData.forEach((data, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.setProperty('--index', idx);
                
                card.innerHTML = `
                    <div class="album-card" data-index="${idx}">
                        <div class="neon-glow" style="box-shadow: 
                            0 0 20px 5px rgba(${data.neonColor.r}, ${data.neonColor.g}, ${data.neonColor.b}, 0.6),
                            0 0 40px 15px rgba(${data.neonColor.r}, ${data.neonColor.g}, ${data.neonColor.b}, 0.4),
                            0 0 80px 25px rgba(${data.neonColor.r}, ${data.neonColor.g}, ${data.neonColor.b}, 0.2),
                            inset 0 0 15px 3px rgba(${data.neonColor.r}, ${data.neonColor.g}, ${data.neonColor.b}, 0.5);"></div>
                        <div class="cover" style="background-image: url('${data.cover}');"></div>
                        <div class="vinyl">
                            <div class="print" style="background-image: url('${data.print}');"></div>
                            <div class="vinyl-label"><span>${data.title.substring(0, 10)}</span></div>
                        </div>
                        <button class="playBtn">▶</button>
                    </div>
                `;
                
                carousel.appendChild(card);
                cards.push(card);
            });
            
            updateCarouselRotation();
            updateActiveCard();
            initRotation();
        }
        
        const anglePerCard = 360 / quantity;
        
        function nextCard() {
            if (isTransitioning) return;
            isTransitioning = true;
            currentRotation -= anglePerCard;
            carousel.style.transform = `perspective(1000px) rotateX(0deg) rotateY(${currentRotation}deg)`;
            setTimeout(() => {
                updateActiveCard();
                updateVisualizerColor();
                isTransitioning = false;
            }, 600);
        }
        
        function prevCard() {
            if (isTransitioning) return;
            isTransitioning = true;
            currentRotation += anglePerCard;
            carousel.style.transform = `perspective(1000px) rotateX(0deg) rotateY(${currentRotation}deg)`;
            setTimeout(() => {
                updateActiveCard();
                updateVisualizerColor();
                isTransitioning = false;
            }, 600);
        }
        
        function updateCarouselRotation() {
            carousel.style.transform = `perspective(1000px) rotateX(0deg) rotateY(${currentRotation}deg)`;
        }
        
        function updateActiveCard() {
            const rawAngle = (-currentRotation) % 360;
            let angle = rawAngle < 0 ? rawAngle + 360 : rawAngle;
            
            let bestIdx = 0;
            let bestDiff = 360;
            
            for (let i = 0; i < quantity; i++) {
                const cardAngle = (i * anglePerCard) % 360;
                let diff = Math.abs(cardAngle - angle);
                if (diff > 180) diff = 360 - diff;
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestIdx = i;
                }
            }
            
            currentCardIndex = bestIdx;
            
            cards.forEach((card, idx) => {
                card.classList.remove('active');
                if (idx === bestIdx) {
                    card.classList.add('active');
                }
            });
        }
        
        function updateVisualizerColor() {
            if (!visualizerMaterial) return;
            const color = albumsData[currentCardIndex].vizColor;
            visualizerMaterial.uniforms.activeColor.value = new THREE.Vector3(color.r, color.g, color.b);
        }
        
        function initRotation() {
            cards.forEach((card, idx) => {
                const albumCard = card.querySelector('.album-card');
                const playBtn = card.querySelector('.playBtn');
                const cover = card.querySelector('.cover');
                const vinyl = card.querySelector('.vinyl');
                const trackData = albumsData[idx];
                
                albumCard.isPlaying = false;
                albumCard.updateVisualState = function() {
                    if (albumCard.isPlaying) {
                        cover.classList.add('hidden');
                        vinyl.classList.add('visible');
                        playBtn.classList.add('playing');
                        playBtn.textContent = '⏹';
                        isVinylSpinning = true;
                        startVinylSpinning(vinyl);
                    } else {
                        cover.classList.remove('hidden');
                        vinyl.classList.remove('visible');
                        playBtn.classList.remove('playing');
                        playBtn.textContent = '▶';
                        isVinylSpinning = false;
                        stopVinylSpinning();
                        resetVinylRotation(vinyl);
                    }
                };
                
                playBtn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    
                    if (!albumCard.isPlaying) {
                        if (currentAudio) {
                            currentAudio.pause();
                            currentAudio = null;
                        }
                        if (currentAlbumCard) {
                            currentAlbumCard.isPlaying = false;
                            currentAlbumCard.updateVisualState();
                            currentAlbumCard = null;
                        }
                        isVinylSpinning = false;
                        stopVinylSpinning();
                        hidePlayer();
                        
                        if (!audioCtx) {
                            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            analyser = audioCtx.createAnalyser();
                            analyser.fftSize = 256;
                            dataArray = new Uint8Array(analyser.frequencyBinCount);
                        }
                        
                        try {
                            if (audioCtx.state === 'suspended') {
                                await audioCtx.resume();
                            }
                            
                            const audio = new Audio();
                            audio.crossOrigin = "anonymous";
                            audio.preload = "auto";
                            audio.src = trackData.audioUrl;
                            audio.loop = false;
                            
                            const source = audioCtx.createMediaElementSource(audio);
                            source.connect(analyser);
                            analyser.connect(audioCtx.destination);
                            
                            await audio.play();
                            
                            currentAudio = audio;
                            currentAlbumCard = albumCard;
                            albumCard.isPlaying = true;
                            albumCard.updateVisualState();
                            albumCard.audio = audio;
                            
                            showPlayer(trackData.title, trackData.artist);
                            playerPlayBtn.textContent = '⏸';
                            
                            audio.addEventListener('ended', () => {
                                if (currentAlbumCard === albumCard) {
                                    stopAllAudioAndReset();
                                }
                            });
                            
                            audio.addEventListener('loadedmetadata', () => {
                                durationTimeSpan.textContent = formatTime(audio.duration);
                            });
                            
                            audio.addEventListener('timeupdate', () => {
                                if (currentAlbumCard === albumCard && !isSeeking) {
                                    const percent = (audio.currentTime / audio.duration) * 100;
                                    progressFill.style.width = `${percent}%`;
                                    currentTimeSpan.textContent = formatTime(audio.currentTime);
                                }
                            });
                            
                        } catch(err) {
                            console.error("Playback error:", err);
                            alert("Nie można odtworzyć utworu. Błąd: " + err.message);
                        }
                    } else {
                        if (albumCard.audio) {
                            albumCard.audio.pause();
                            albumCard.audio.currentTime = 0;
                            albumCard.audio = null;
                        }
                        albumCard.isPlaying = false;
                        albumCard.updateVisualState();
                        if (currentAlbumCard === albumCard) {
                            currentAlbumCard = null;
                            currentAudio = null;
                            hidePlayer();
                            playerPlayBtn.textContent = '▶';
                        }
                        isVinylSpinning = false;
                        stopVinylSpinning();
                    }
                });
                
                albumCard.updateVisualState();
            });
        }
        
        // === Obsługa przeciągania paska postępu ===
        let isDragging = false;
        
        progressWrapper.addEventListener('mousedown', (e) => {
            if (!currentAudio || !currentAlbumCard) return;
            isDragging = true;
            isSeeking = true;
            const rect = progressWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = Math.min(100, Math.max(0, (x / rect.width) * 100));
            progressFill.style.width = `${percent}%`;
            const newTime = (percent / 100) * currentAudio.duration;
            currentAudio.currentTime = newTime;
            currentTimeSpan.textContent = formatTime(newTime);
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isDragging || !currentAudio) return;
            const rect = progressWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = Math.min(100, Math.max(0, (x / rect.width) * 100));
            progressFill.style.width = `${percent}%`;
            const newTime = (percent / 100) * currentAudio.duration;
            currentAudio.currentTime = newTime;
            currentTimeSpan.textContent = formatTime(newTime);
        });
        
        window.addEventListener('mouseup', () => {
            isDragging = false;
            isSeeking = false;
        });
        
        // === WIZUALIZATOR ===
        let visualizerMaterial;
        let bassEnergy = 0;
        let transitionVal = 0;
        let timeVal = 0;
        
        const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
        `;
        
        const fragmentShader = `
        uniform vec2 iResolution;
        uniform float iTime;
        uniform float bassEnergy;
        uniform float transitionFactor;
        uniform vec3 activeColor;
        
        varying vec2 vUv;
        
        float smootherstep(float edge0, float edge1, float x) {
            float t = clamp((x - edge0) / (edge1 - edge0), 0.0, 1.0);
            return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
        }
        
        void main() {
            vec2 p = vUv;
            vec2 center = vec2(0.5, 0.5);
            float dist = distance(p, center);
            
            float pulse = 0.5 + bassEnergy * 0.8 * transitionFactor;
            float glowSize = 0.3 + bassEnergy * 0.25 * transitionFactor;
            
            float glow = 1.0 - smootherstep(glowSize - 0.15, glowSize + 0.15, dist);
            glow = pow(glow, 1.5) * pulse;
            
            float wave1 = sin(dist * 20.0 - iTime * 2.0) * 0.1;
            float wave2 = sin(dist * 35.0 + iTime * 1.5) * 0.07;
            float wave = (wave1 + wave2) * bassEnergy * transitionFactor;
            
            vec3 bgColor = vec3(0.03, 0.03, 0.08);
            vec3 glowColor = activeColor;
            
            float noise = fract(sin(p.x * 200.0 + p.y * 100.0 + iTime * 10.0) * 43758.5453);
            noise = noise * 0.05;
            
            vec3 finalColor = bgColor + glowColor * glow * 0.6 + glowColor * wave * 0.3 + noise;
            float vignette = 1.0 - dist * 0.5;
            finalColor *= vignette;
            
            gl_FragColor = vec4(finalColor, 0.9);
        }
        `;
        
        function initVisualizer() {
            const canvas = document.getElementById('visualizer-canvas');
            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            camera.position.z = 1;
            
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            
            visualizerMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    iTime: { value: 0 },
                    bassEnergy: { value: 0 },
                    transitionFactor: { value: 0 },
                    activeColor: { value: new THREE.Vector3(0.2, 0.5, 0.9) }
                },
                transparent: true
            });
            
            const geometry = new THREE.PlaneGeometry(2, 2);
            const mesh = new THREE.Mesh(geometry, visualizerMaterial);
            scene.add(mesh);
            
            function animateVisualizer() {
                requestAnimationFrame(animateVisualizer);
                timeVal += 0.016;
                visualizerMaterial.uniforms.iTime.value = timeVal;
                
                let anyPlaying = false;
                let energy = 0;
                cards.forEach(card => {
                    const albumCard = card.querySelector('.album-card');
                    if (albumCard.isPlaying) {
                        anyPlaying = true;
                    }
                });
                
                if (anyPlaying && transitionVal < 1.0) {
                    transitionVal = Math.min(transitionVal + 0.02, 1.0);
                    visualizerMaterial.uniforms.transitionFactor.value = transitionVal;
                } else if (!anyPlaying && transitionVal > 0.0) {
                    transitionVal = Math.max(transitionVal - 0.02, 0.0);
                    visualizerMaterial.uniforms.transitionFactor.value = transitionVal;
                }
                
                if (anyPlaying && analyser && dataArray && currentAudio && !currentAudio.paused) {
                    try {
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < 20; i++) {
                            sum += dataArray[i];
                        }
                        energy = sum / (20 * 255);
                        bassEnergy = bassEnergy * 0.7 + energy * 0.3;
                    } catch(e) {}
                } else if (anyPlaying) {
                    bassEnergy = bassEnergy * 0.8 + 0.2 * 0.2;
                } else {
                    bassEnergy = bassEnergy * 0.95;
                }
                
                visualizerMaterial.uniforms.bassEnergy.value = bassEnergy;
                renderer.render(scene, camera);
            }
            
            animateVisualizer();
            
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                visualizerMaterial.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
            });
        }
        
        // === START ===
        document.getElementById('prevBtn').addEventListener('click', () => nextCard());
        document.getElementById('nextBtn').addEventListener('click', () => prevCard());
        
        generateCarousel();
        initVisualizer();
        
        setTimeout(() => updateVisualizerColor(), 100);
        
        setTimeout(() => {
            threeReady = true;
            if (logoLoaded) hidePreloader();
        }, 500);
    </script>
</body>
