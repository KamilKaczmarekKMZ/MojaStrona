<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Winylowa Karuzela 3D - Logo 3D na górze</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
    <div id="visualizer-container">
        <canvas id="visualizer-canvas"></canvas>
    </div>

    <!-- LOGO 3D NA GÓRZE (wycentrowane, mniejsze, obracające się) -->
    <div class="logo-3d-container">
        <model-viewer
            class="logo-3d"
            src="assets/twoje-logo.glb"
            alt="3D Logo"
            interaction-prompt="none"
            camera-orbit="0deg 90deg 0deg"
            exposure="1.2"
            environment-image="https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr"
            shadow-intensity="0"
            auto-rotate
            rotation-per-second="15deg"
            style="background-color: transparent; width: 100%; height: 100%;"
        >
            <div class="model-placeholder" slot="poster">
                <p>Ładowanie...</p>
            </div>
        </model-viewer>
    </div>

    <div id="wrap">
        <div class="nav-arrow nav-left" id="prevBtn">◀</div>
        <div class="nav-arrow nav-right" id="nextBtn">▶</div>

        <div class="wrapper">
            <div class="inner" id="carousel3d" style="--quantity: 3;"></div>
        </div>
    </div>

    <!-- ODTWARZACZ NA DOLE -->
    <div id="player" class="player">
        <button id="playerPlayBtn" class="player-play-btn">▶</button>
        <div class="player-info">
            <div id="playerTitle" class="player-title">Brak utworu</div>
            <div id="playerArtist" class="player-artist">-</div>
        </div>
        <div class="player-progress-container">
            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-fill" id="progressFill">
                    <div class="progress-handle" id="progressHandle"></div>
                </div>
            </div>
        </div>
        <div class="player-times">
            <span id="currentTime">0:00</span>
            <span>/</span>
            <span id="durationTime">0:00</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.175.0"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
