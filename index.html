<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ KMZ | SmartSystemsKK</title>
    <style>
        /* CSS w osobnym bloku poniżej */
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="bg-app"></div>

    <section id="hero-section" class="hero active">
        <div class="hero-content">
            <h1 class="animated-text">DJ KMZ</h1>
            <div class="hero-buttons">
                <button id="letsBeginBtn" class="btn btn-transparent">Let's Begin</button>
                <button id="learnMoreBtn" class="btn btn-transparent">Learn more</button>
            </div>
        </div>
        <!-- model 3D opcjonalny -->
        <div class="hero-model">
            <div class="model-placeholder"></div>
        </div>
    </section>

    <section id="form-section" class="form-section">
        <button id="backBtn" class="btn-back">← Back</button>
        <div class="form-steps">
            <!-- Steps 1-5 -->
            <div class="step active" data-step="0">
                <h3>Contact Details</h3>
                <label>Name</label>
                <input type="text" id="name" placeholder="Your name">
                <div id="name-error" class="error-message"></div>
                <label>Email</label>
                <input type="email" id="email" placeholder="Your email">
                <div id="email-error" class="error-message"></div>
            </div>
            <div class="step" data-step="1">
                <h3>Company Size</h3>
                <label class="container">1-10 employees
                    <input type="radio" name="companySize" value="1-10">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <label class="container">11-50 employees
                    <input type="radio" name="companySize" value="11-50">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <label class="container">51-200 employees
                    <input type="radio" name="companySize" value="51-200">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <label class="container">201-500 employees
                    <input type="radio" name="companySize" value="201-500">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <div id="companySize-error" class="error-message"></div>
            </div>
            <div class="step" data-step="2">
                <h3>What do you do?</h3>
                <textarea id="occupation" placeholder="Describe your main activities..."></textarea>
                <div id="occupation-error" class="error-message"></div>
            </div>
            <div class="step" data-step="3">
                <h3>Automation experience</h3>
                <label class="container">None
                    <input type="radio" name="experience" value="none">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <label class="container">Basic
                    <input type="radio" name="experience" value="basic">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <label class="container">Intermediate
                    <input type="radio" name="experience" value="intermediate">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <label class="container">Advanced
                    <input type="radio" name="experience" value="advanced">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <div id="experience-error" class="error-message"></div>
            </div>
            <div class="step" data-step="4">
                <h3>Receive emails?</h3>
                <label class="container">Yes
                    <input type="radio" name="receiveEmails" value="yes">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <label class="container">No
                    <input type="radio" name="receiveEmails" value="no">
                    <svg viewBox="0 0 64 64" height="25" width="25">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8" class="path"></path>
                    </svg>
                </label>
                <div id="receiveEmails-error" class="error-message"></div>
            </div>
            <div class="step-navigation">
                <button id="prevStepBtn" class="btn-nav prev-nav">← Prev</button>
                <button id="nextStepBtn" class="btn-nav next-nav">Next →</button>
            </div>
            <button id="submitForm" class="btn-submit" disabled>Submit</button>
        </div>
        <div class="step-indicators">
            <div class="indicator active"></div>
            <div class="indicator"></div>
            <div class="indicator"></div>
            <div class="indicator"></div>
            <div class="indicator"></div>
        </div>
    </section>

    <section id="chat-section" class="chat-section">
        <button id="closeChatBtn" class="btn-close">✕ Close</button>
        <div class="chat-container">
            <h3>Chat with us</h3>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type your message...">
                <button id="sendMessageBtn">Send</button>
            </div>
        </div>
    </section>

    <script>
        // JavaScript w osobnym bloku poniżej
    </script>
</body>
</html>
